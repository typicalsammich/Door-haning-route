  var q=document.getElementById('search').value.trim().toLowerCase();
  var list=document.getElementById('list');list.innerHTML='';
  D.routes[curRoute].forEach(function(c,i){
    var d=clusterDone(curRoute,c);
    var bizRows=c.biz.filter(function(b){
      return !q||b[1].toLowerCase().indexOf(q)>-1||b[2].toLowerCase().indexOf(q)>-1||b[3].toLowerCase().indexOf(q)>-1;
    });
    if(q&&!bizRows.length)return;
    var det=document.createElement('details');det.className='cluster';
    var sum=document.createElement('summary');
    sum.innerHTML='<span class="cnum'+(d===c.n?' done':'')+'" style="background:'+ROUTE_COLOR[curRoute]+'">'+(d===c.n?'\u2713':(i+1))+'</span><span>'+esc(c.name)+'</span><span class="cmeta">'+d+'/'+c.n+'</span>';
    det.appendChild(sum);
    det.addEventListener('toggle',function(){if(det.open)map.flyTo([c.lat,c.lon],14,{duration:0.8});});
    bizRows.forEach(function(b){
      var s=b[0];
      var lab=document.createElement('label');lab.className='biz'+(P[curRoute][s]?' done':'');lab.setAttribute('data-s',s);
      lab.innerHTML='<input type="checkbox"'+(P[curRoute][s]?' checked':'')+'><span class="sn">'+s+'</span><span><span class="bname"><b>'+esc(b[1])+'</b></span><br><span class="addr">'+esc(b[2])+' \u00b7 '+esc(b[3])+'</span></span>';
      var cb=lab.querySelector('input');
      cb.addEventListener('change',function(){setBiz(curRoute,s,cb.checked);});
      det.appendChild(lab);
    });
    list.appendChild(det);
  });
  refreshBars();
}
document.getElementById('search').addEventListener('input',renderList);
document.getElementById('sideToggle').addEventListener('click',function(){document.getElementById('side').classList.toggle('open');});
document.getElementById('btnReset').addEventListener('click',function(){
  if(confirm('Clear all checkmarks for all routes?')){P={"1":{},"2":{},"3":{},"4":{}};save();
    ROUTES.forEach(function(r){Object.keys(bizDots[r]).forEach(function(s){refreshBizDot(r,s);});
      clusterPins[r].forEach(function(cp){cp.pin.setStyle({fillColor:ROUTE_COLOR[r]});});});
    renderList();}
});
document.getElementById('btnExport').addEventListener('click',function(){
  var blob=new Blob([JSON.stringify({version:2,progress:P,mileage:MILES})],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='vaa-routes-progress.json';a.click();
});
document.getElementById('btnImport').addEventListener('click',function(){document.getElementById('fileImp').click();});
document.getElementById('fileImp').addEventListener('change',function(e){
  var f=e.target.files[0];if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){try{var p=JSON.parse(rd.result);
    var prog=p.progress||p;var ok=ROUTES.some(function(r){return prog[r];});
    if(ok){ROUTES.forEach(function(r){P[r]=prog[r]||{};});save();
      if(p.mileage&&p.mileage.length!==undefined){MILES=p.mileage;mSave();}
      ROUTES.forEach(function(r){Object.keys(bizDots[r]).forEach(function(s){refreshBizDot(r,s);});
        clusterPins[r].forEach(function(cp,idx){refreshClusterPin(r,idx);});});
      renderList();alert('Progress imported.');
    }else alert('That file does not look like a progress export.');}catch(err){alert('Could not read that file.');}};
  rd.readAsText(f);e.target.value='';
});
var MKEY='vaa-routes-mileage-v1';
var MILES=[];
try{var mr=localStorage.getItem(MKEY);if(mr)MILES=JSON.parse(mr);}catch(e){MILES=[];}
function mSave(){try{localStorage.setItem(MKEY,JSON.stringify(MILES));}catch(e){}}
function mRouteTotal(r){var s=0;MILES.forEach(function(e){if(e.route===r)s+=(+e.miles)||0;});return s;}
function mTotal(){var s=0;MILES.forEach(function(e){s+=(+e.miles)||0;});return s;}
function renderMiles(){
  document.getElementById('milesTotal').textContent='Logged total: '+mTotal().toFixed(1)+' mi across '+MILES.length+' '+(MILES.length===1?'entry':'entries');
  var rr=document.getElementById('milesRouteRows');rr.innerHTML='';
  ROUTES.forEach(function(r){
    var div=document.createElement('div');
    div.innerHTML='<span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:'+ROUTE_COLOR[r]+';margin-right:5px"></span>'+ROUTE_LABEL[r]+': <b>'+mRouteTotal(r).toFixed(1)+' mi</b> logged (est. '+ROUTE_MILES[r]+' mi)';
    rr.appendChild(div);
  });
  var list=document.getElementById('milesList');list.innerHTML='';
  MILES.slice().reverse().forEach(function(e){
    var idx=MILES.indexOf(e);
    var row=document.createElement('div');row.className='mrow';
    row.innerHTML='<b>'+(+e.miles).toFixed(1)+' mi</b><span class="mmeta">'+esc(ROUTE_LABEL[e.route]||('Route '+e.route))+(e.note?' \u00b7 '+esc(e.note):'')+'<br>'+esc(e.when||'')+'</span>';
    var del=document.createElement('button');del.className='mdel';del.textContent='\u00d7';del.title='Delete entry';
    del.addEventListener('click',function(){MILES.splice(idx,1);mSave();renderMiles();});
    row.appendChild(del);list.appendChild(row);
  });
  var sel=document.getElementById('mRoute');
  if(!sel.options.length){ROUTES.forEach(function(r){var o=document.createElement('option');o.value=r;o.textContent=ROUTE_LABEL[r];sel.appendChild(o);});}
}
document.getElementById('btnMiles').addEventListener('click',function(){renderMiles();document.getElementById('milesModal').classList.remove('hide');});
document.getElementById('mClose').addEventListener('click',function(){document.getElementById('milesModal').classList.add('hide');});
document.getElementById('milesModal').addEventListener('click',function(e){if(e.target===this)this.classList.add('hide');});
document.getElementById('mClear').addEventListener('click',function(){if(confirm('Clear the whole mileage log?')){MILES=[];mSave();renderMiles();}});
document.getElementById('mAdd').addEventListener('click',function(){
  var mi=parseFloat(document.getElementById('mMiles').value);
  if(!(mi>0)){alert('Enter the miles driven.');return;}
  MILES.push({route:document.getElementById('mRoute').value,miles:Math.round(mi*10)/10,note:document.getElementById('mNote').value.trim(),when:new Date().toLocaleString()});
  document.getElementById('mMiles').value='';document.getElementById('mNote').value='';
  mSave();renderMiles();
});
renderTabs();renderList();
</script></body></html>
